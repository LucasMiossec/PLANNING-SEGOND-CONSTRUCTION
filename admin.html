<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Récapitulatif Direction - Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- NAVBAR TOP -->
  <header class="top-nav">
    <a href="cadres.html" class="btn-back">← Retour</a>
    <h1>📊 Récapitulatif Direction</h1>
  </header>

  <div class="container">
    
    <!-- BARRE DE NAVIGATION SEMAINE & BOUTONS -->
    <div class="week-controls">
      <button id="prev-week" class="btn-nav">← Semaine précédente</button>
      <div class="picker-group">
        <label for="week-date">Semaine du :</label>
        <input type="date" id="week-date">
        <span id="week-range" style="margin-left: 10px; font-weight: bold; color: #cbd5e1;"></span>
      </div>
      <button id="next-week" class="btn-nav">Semaine suivante →</button>
      <button id="btn-refresh" class="btn-refresh">🔄 Actualiser</button>
      <button id="btn-print-admin" class="btn-print" style="background-color: #059669; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">🖨️ Imprimer Récapitulatif</button>
    </div>

    <!-- TABLEAU DASHBOARD SYNTHÉTIQUE -->
    <section class="dashboard-section">
      <h2>📌 Suivi des Saisies de la Semaine</h2>
      <div class="legend">
        <span class="badge badge-green">🟩 ≥ 39h (Complété)</span>
        <span class="badge badge-yellow">🟨 1h à 38.5h (En cours)</span>
        <span class="badge badge-white">⬜ 0h (Non rempli)</span>
      </div>

      <div id="dashboard-container" class="dashboard-grid">
        <!-- Généré dynamiquement en JS par corps d'état -->
      </div>
    </section>

    <!-- DÉTAILS DES FEUILLES D'HEURES -->
    <section class="details-section">
      <h2>📋 Détail des Feuilles d'Heures</h2>
      <div id="details-container">
        <!-- Cartes détaillées générées dynamiquement -->
      </div>
    </section>

  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
