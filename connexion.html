<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Segond Construction</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111820;color:white;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.panel{width:min(100%,430px);background:#1b2632;border:1px solid #394655;border-radius:16px;padding:30px;box-shadow:0 15px 50px #0005;text-align:center}.logo{max-width:180px;max-height:110px;object-fit:contain}h1{font-size:23px;margin:16px 0 5px}p{color:#bdc7d4}label{display:block;text-align:left;margin:18px 0 7px}input{width:100%;border-radius:8px;border:1px solid #637184;background:#0e1721;color:#fff;padding:14px;font-size:16px}button{width:100%;margin-top:23px;background:#b60000;color:white;border:0;border-radius:9px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.55}a{display:inline-block;color:#ddd;margin-top:20px}#error{color:#ffb5b5;min-height:1.5em;font-size:14px}
